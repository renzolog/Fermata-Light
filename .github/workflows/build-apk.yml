name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Estrae lo zip dei sorgenti presente nella root del repo
      - name: Unzip sources
        run: |
          ZIP=$(ls ./*.zip | head -n 1)
          [ -z "$ZIP" ] && { echo "Nessuno zip trovato nella root del repo"; exit 1; }
          echo "Estraggo $ZIP"
          mkdir -p src
          unzip -q -o "$ZIP" -d src
          GRADLEW=$(find src -maxdepth 3 -name gradlew | head -n 1)
          [ -z "$GRADLEW" ] && { echo "gradlew non trovato nello zip"; exit 1; }
          SRC_DIR=$(dirname "$GRADLEW")
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "Sorgenti in: $SRC_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Firma stabile: senza questi secret ogni build genera una chiave nuova
      # e l'APK non si installa sopra la versione precedente (serve disinstallare).
      - name: Create keystore (optional)
        env:
          CI_KEYSTORE: ${{ secrets.CI_KEYSTORE }}
        run: |
          [ -z "$CI_KEYSTORE" ] && exit 0
          echo "$CI_KEYSTORE" | base64 -d > "$SRC_DIR/keystore.jks"
          cat > "$SRC_DIR/local.properties" <<EOP
          storeFile=$(pwd)/$SRC_DIR/keystore.jks
          keyAlias=${{ secrets.CI_ALIAS }}
          keyPassword=${{ secrets.CI_KEY_PWD }}
          storePassword=${{ secrets.CI_KEYSTORE_PWD }}
          EOP

      - name: Build APK (arm64)
        working-directory: ${{ env.SRC_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew fermata:packageAutoReleaseUniversalApk \
            -PABI=arm64-v8a \
            -PAPP_NAME="Fermata Clean" \
            -PAPP_ID_SFX=.clean \
            --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fermata-clean-arm64
          path: ${{ env.SRC_DIR }}/fermata/build/outputs/apk_from_bundle/autoRelease/*.apk
          retention-days: 30
          if-no-files-found: error
          
